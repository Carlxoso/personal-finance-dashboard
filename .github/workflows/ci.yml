# Revisa cada push y pull request: tipos del frontend y backend, build del frontend y pruebas del backend.
name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm run build   # incluye tsc --noEmit

  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: finanzas_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U ci" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      # Variables solo para la base temporal de CI; no son secretos reales.
      - name: Crear .env.test
        run: |
          cat > .env.test <<'ENV'
          NODE_ENV=test
          PORT=4001
          DATABASE_URL=postgresql://ci:ci@localhost:5432/finanzas_test
          JWT_SECRET=ci-only-secret-0123456789abcdef0123456789
          CORS_ORIGIN=http://localhost:5173
          ENV
      - run: npx prisma generate
      - run: npm run typecheck
      - run: npm run test:db
      - run: npm test
