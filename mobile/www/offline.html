<!doctype html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Sin conexión · Finanzas</title>
  <script src="app-url.js"></script>
  <style>
    * { box-sizing: border-box; }
    body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 24px;
           font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; background: #fff; color: #111827; }
    main { max-width: 320px; text-align: center; }
    img { width: 72px; height: 72px; }
    h1 { margin: 24px 0 8px; font-size: 1.35rem; font-weight: 600; }
    p { margin: 0; color: #6b7280; line-height: 1.5; font-size: .95rem; }
    button { margin-top: 28px; width: 100%; border: 0; border-radius: 10px; padding: 14px; background: #0d9488;
             color: #fff; font-size: 1rem; font-weight: 600; }
    button:active { background: #0f766e; }
    small { display: block; margin-top: 16px; color: #9ca3af; font-size: .8rem; }
  </style>
</head>
<body>
  <main>
    <img src="logo.png" alt="" />
    <h1>No hay conexión</h1>
    <p>Finanzas necesita internet para mostrar tus datos. Revisa tu Wi-Fi o datos móviles e inténtalo de nuevo.</p>
    <button onclick="retry()">Reintentar</button>
    <small id="msg"></small>
  </main>
  <script>
    function retry() {
      if (!navigator.onLine) { document.getElementById('msg').textContent = 'Todavía sin conexión…'; return; }
      location.replace(window.APP_URL || '/');
    }
    window.addEventListener('online', retry);   // vuelve solo cuando regresa la conexión
  </script>
</body>
</html>
